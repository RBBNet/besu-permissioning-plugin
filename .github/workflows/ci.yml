name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Unit Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Check code formatting (Spotless)
        run: ./gradlew spotlessCheck

      - name: Build shadow JAR and run unit tests
        run: ./gradlew clean shadowJar test

      - name: Build and test testbench framework
        run: |
          cd test-tools/onchain-testbench
          ./gradlew clean test
